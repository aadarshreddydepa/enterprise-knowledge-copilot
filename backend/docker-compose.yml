services:
  postgres:
    image: postgres:15
    container_name: enterprise_kcopilot_db
    environment:
      POSTGRES_DB: enterprise_kcopilot
      POSTGRES_USER: kcopilot
      POSTGRES_PASSWORD: kcopilot_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: enterprise_kcopilot_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build: .
    container_name: enterprise_kcopilot_backend
    depends_on:
      - postgres
      - ollama
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://kcopilot:kcopilot_dev@postgres:5432/enterprise_kcopilot
      DATABASE_URL_SYNC: postgresql://kcopilot:kcopilot_dev@postgres:5432/enterprise_kcopilot
      JWT_SECRET_KEY: super-secret-key
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  ollama_data:
